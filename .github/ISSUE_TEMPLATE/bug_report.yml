name: Bug report
description: Report a reproducible problem in Media Transcoder
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach private media, credentials, tokens, or sensitive metadata.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      description: Paste a sanitized Media Transcoder command.
      placeholder: media-transcoder convert input.mkv output.mp4 --preset web
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version
      placeholder: "ffmpeg version ..."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized error output
      description: Remove private paths, filenames, metadata, credentials, and personal information.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I verified that FFmpeg and FFprobe are available on PATH.
          required: true
        - label: I removed private or sensitive information from this report.
          required: true
