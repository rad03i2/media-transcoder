[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-transcoder"
version = "1.0.0"
description = "Safe local FFmpeg transcoding CLI with presets, probing, batch conversion, and dry-run support."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["ffmpeg", "video", "audio", "transcoding", "cli"]

[project.scripts]
media-transcoder = "media_transcoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
